[project]
name = "stock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "edgartools>=5.35.1",
    "tavily-python>=0.5",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langgraph>=1.2.7",
    "langchain-openai>=1.3.3",
    "pydantic>=2",
    "rich>=15.0.0",
]

[project.scripts]
stock = "stockagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockagent"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["stockagent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
